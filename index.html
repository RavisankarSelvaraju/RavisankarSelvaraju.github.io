<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ravisankar Selvaraju — Portfolio</title>
  <meta name="description" content="Robotics application engineer — state estimation, sensor fusion, and manipulation." />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231a5276'/%3E%3Ctext x='32' y='42' font-family='Georgia, serif' font-size='28' font-weight='600' fill='white' text-anchor='middle'%3ERS%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
</head>
<body>

  <div class="page">

    <!-- SIDEBAR -->
    <aside class="sidebar">
      <div class="sidebar-inner">
        <div class="avatar">
          <img src="assets/photo.jpg" alt="Ravisankar Selvaraju" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex'" />
          <div class="avatar-placeholder">RS</div>
        </div>

        <h1 id="profile-name"></h1>
        <p class="title" id="profile-title"></p>
        <p class="location" id="profile-location"></p>

        <p class="bio" id="profile-bio"></p>

        <div class="section-label">Education</div>
        <ul class="education-list" id="education-list"></ul>

        <div class="section-label">Skills</div>
        <div class="skill-chips" id="skill-chips"></div>

        <div class="links" id="profile-links"></div>
      </div>
    </aside>

    <!-- MAIN -->
    <main class="main">

      <section class="section" id="experience-section">
        <div class="section-header">
          <h2>Experience &amp; Projects</h2>
          <nav class="filter-pills" id="filter-pills"></nav>
        </div>
        <div class="timeline" id="timeline"></div>
      </section>

      <section class="section" id="achievements-section">
        <h2>Achievements</h2>
        <div class="achievement-list" id="achievement-list"></div>
      </section>

      <section class="section" id="publications-section">
        <h2>Publications</h2>
        <p class="section-note">Publication links are placeholders until added — see <code>data.js</code>.</p>
        <ul class="publication-list" id="publication-list"></ul>
      </section>

    </main>
  </div>

  <!-- MODAL -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal" id="modal">
      <button class="modal-close" id="modal-close" aria-label="Close">&times;</button>
      <div class="modal-content" id="modal-content"></div>
    </div>
  </div>

  <footer class="footer">
    <p>Ravisankar Selvaraju &middot; Built with plain HTML/CSS/JS &middot; <span id="footer-year"></span></p>
  </footer>

  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
